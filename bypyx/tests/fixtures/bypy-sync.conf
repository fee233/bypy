##############################################################################
# bypy-sync.conf —— 多目录镜像同步配置
# 修改后无需重启任何服务，下次任务执行即生效
##############################################################################

# ---- bypy 可执行文件路径 ----
# auto = 自动探测（command -v bypy / /usr/local/bin/bypy / ~/.local/bin/bypy）
# 若用虚拟环境，填绝对路径，例如：/opt/bypy-venv/bin/bypy
BYPY_BIN=auto

# ---- bypy 授权信息所在的家目录 ----
# bypy 的 token 存在 $HOME/.bypy/bypy.json
# 宝塔以 root 执行计划任务时通常是 /root；若你当初用别的用户授权，这里改成那个用户的家目录
# 留空 = 不覆盖当前 HOME
BYPY_HOME=/root

# ---- 日志 ----
LOG_DIR=/var/log/bypy-sync
LOG_KEEP_DAYS=7          # 保留多少天的日志（0 = 不清理）

# ---- 同步行为 ----
RETRY=5                   # 单个文件上传失败的重试次数（bypy -r）
VERBOSE=0                 # 1 = 输出每个文件的详细进度（日志会变大）
SLEEP_BETWEEN=2           # 每个任务之间的间隔秒数，降低百度 API 触发限流的概率
TASK_TIMEOUT=0            # 单个任务的硬超时秒数，0 = 不限制
VERIFY_UPLOAD=0           # 1 = 上传后校验 md5（更可靠，但慢一倍）
PROCESSES=1               # 并发进程数（bypy 1.8+ 支持）。小文件多时调到 3~4 明显更快；
SLICE=2GB                 # 分片阈值。百度已废弃 bypy 的分片上传接口，
                          # 调到 2GB 让文件走单次上传（bypy 上限就是 2GB）
NET_TIMEOUT=3600          # 单次网络超时秒数，大文件必须放宽
                          # 出现 403 / 限流报错就降回 1

# ---- 并发锁 ----
# 上一次任务没跑完时，新任务直接跳过（宝塔定时任务很需要这个）
LOCK_FILE=/tmp/bypy-sync.lock

##############################################################################
# 任务列表
#
# 格式（用 | 分成 6 段，后两段可留空）：
#   "名称|方向|本地目录|远端目录|删除多余|文件过滤正则"
#
#   名称       任意标识，用于日志和 --task 单独执行
#   方向       up   = 本地 → 网盘（备份）
#              down = 网盘 → 本地（拉取）
#   本地目录   必须是绝对路径
#   远端目录   相对百度网盘 /apps/bypy 的路径，不要写 /apps/bypy 前缀
#   删除多余   1 = 镜像模式：删掉“另一边多出来的”文件/目录（危险，见 README）
#              0 或留空 = 只增不删（推荐）
#   过滤正则   bypy --include-regex，作用于本地文件（up）或远端文件（down）
#              留空 = 全部同步
#              注意：bypy 内部用的是 re.match（从路径开头匹配），不是 search，
#              所以匹配扩展名要写成 .*\.sql$ 这种，只写 \.sql$ 是匹配不到的
#              在 shell 双引号里反斜杠要写两个：.*\\.sql\\.gz$
#
# 示例（按需删改，注意每行结尾的逗号）：
##############################################################################

TASKS=(
  # 宝塔备份 → 网盘 bt_backup 目录，镜像模式（本地删了备份，云端也删
  "bt_backup|up|/www/backup|bt_backup|1|"

  # cloudreve 备份 → 网盘 cloudreve，镜像模式（本地删了备份，云端也删）
  "cloudreve|up|/var/lib/docker/volumes/cloudreve_data|cloudreve|1|"

  # immich 备份 → 网盘 immich 目录，镜像模式（本地删了备份，云端也删）
  # 跳过可重建的衍生物：encoded-video(9.6G)、thumbs(818M)
  'immich|up|/var/lib/docker/volumes/immich_data|immich|1|^(?!.*(?:^|/)(encoded-video|thumbs)(/|$)).*$'
)
